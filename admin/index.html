<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin jemputan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital@1&family=Italianno&family=Manrope:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css?v=2.0.3">
  <link rel="stylesheet" href="admin.css?v=2.0.3">
</head>
<body>
  <main class="admin-gate" id="gate">
    <form id="unlock-form" class="admin-card">
      <h1>Admin jemputan</h1>
      <p>Halaman ini tidak dipautkan dari jemputan. Tetamu tidak dapat melihatnya.</p>
      <label class="editor-field"><span>Kata laluan</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="unlock-error" role="alert" hidden></p>
      <button class="button" type="submit">Buka</button>
    </form>
  </main>
  <div class="studio" id="studio" hidden>
    <form id="editor" class="admin-form"></form>
    <div class="preview-column">
      <p class="preview-label">Pratonton = halaman tetamu (kotak putus-putus = sunting sahaja)</p>
      <iframe id="preview" title="Pratonton langsung jemputan" src="../?preview=draft&v=2.0.3"></iframe>
    </div>
  </div>
  <script src="../content.js?v=2.0.3"></script>
  <script src="admin.js?v=2.0.3"></script>
</body>
</html>
