<!DOCTYPE html>
<html lang="ms">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Jemputan walimatul urus.">
  <title>Jemputan walimatul urus</title>
  <!--
    Guest-facing wording lives in content.js.
    Guests do not edit the card. Editing stays on /admin/.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital@1&family=Italianno&family=Manrope:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2.0.5">
  <script>
    (function () {
      /* Lock layout to admin preview canvas (390px) so text gaps match on every phone */
      var DESIGN_W = 390;
      var meta = document.querySelector('meta[name="viewport"]');
      function fitDesignViewport() {
        if (!meta) return;
        var inAdmin = window !== window.top || /(?:\?|&)preview=draft(?:&|$)/.test(location.search);
        try {
          inAdmin = inAdmin || sessionStorage.getItem("wedding-admin-open") === "yes";
        } catch (error) {}
        if (inAdmin) {
          meta.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");
          return;
        }
        var deviceW = Math.min(screen.width || DESIGN_W, window.outerWidth || DESIGN_W) || DESIGN_W;
        if (deviceW > 0 && deviceW < 520) {
          /* width=390 → browser scales the whole card like the admin phone frame */
          meta.setAttribute(
            "content",
            "width=" + DESIGN_W + ", user-scalable=no, viewport-fit=cover"
          );
        } else {
          meta.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");
        }
      }
      fitDesignViewport();
      window.addEventListener("orientationchange", function () {
        setTimeout(fitDesignViewport, 60);
      });
      var reduce = false;
      try {
        reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      } catch (error) {
        reduce = false;
      }
      document.documentElement.classList.add(reduce ? "reduce-motion" : "will-open");
    })();
  </script>
</head>
<body>
  <main class="sheet" id="invitation"></main>
  <noscript>
    <p class="noscript">This invitation needs JavaScript to display the wording in content.js.</p>
  </noscript>
  <script src="content.js?v=2.0.5"></script>
  <script src="app.js?v=2.0.5"></script>
</body>
</html>
